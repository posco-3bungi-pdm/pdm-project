name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validation dependency
        run: python -m pip install -r requirements-ci.txt
      - name: Check repository and notebooks
        run: python .github/scripts/check_repository.py
      - name: Check document links and report text
        run: python src/check_delivery.py
      - name: Test report generation and metric checks
        run: python -m unittest discover -s tests -v
