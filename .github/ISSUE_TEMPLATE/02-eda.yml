name: EDA 데이터 탐색
description: 데이터 파일 하나를 정해 기간·간격·결측·분포 같은 성질을 확인합니다.
title: '[EDA] '
labels: ['type: task', 'stage: data']
body:
  - type: markdown
    attributes:
      value: |
        노트북 출력은 커밋 사본에서 자동으로 지워집니다(nbstripout). 공유할 그림은 `figures/` 에 저장하거나 디스코드에 올리고, 원본 CSV는 올리지 않습니다.
        작업 브랜치는 방금 pull한 main에서 만듭니다: `git switch main` → `git pull origin main` → `git switch -c feat/번호-설명`
  - type: textarea
    id: question
    attributes:
      label: 확인할 질문
      placeholder: 예) 온도 데이터가 몇 초 간격으로 기록됐는가?
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: 대상 데이터와 컬럼
      placeholder: 예) T-CR1-CAL01_온도.csv · MEAS_DT, LOT_NO
    validations:
      required: true
  - type: input
    id: notebook
    attributes:
      label: 담당 노트북 파일
      placeholder: notebooks/01_eda_번호_주제.ipynb
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 확인 순서
      placeholder: |
        - [ ] 1단계
        - [ ] 2단계
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 결과 요약과 다음 작업
      description: PR을 올린 뒤 채웁니다. 핵심 숫자와 그림 파일 이름을 적습니다.
