<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 316" width="1200" height="316" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<rect width="1200" height="316" rx="18" fill="#0b0f0c"/>
<rect x="50" y="60" width="340" height="190" rx="16" fill="#131b15" stroke="#a8ff3e" stroke-opacity="0.7"/>
<rect x="50" y="60" width="6" height="190" rx="3" fill="#a8ff3e"/>
<text x="74" y="96" font-size="22" fill="#e9f2e8" font-weight="bold" text-anchor="start" >pdm-project</text>
<text x="74" y="120" font-size="14" fill="#a8ff3e" font-weight="normal" text-anchor="start" >분석 저장소</text>
<text x="74" y="156" font-size="14" fill="#9fb39d" font-weight="normal" text-anchor="start" >• 06 ~ 13 정답 만들기 (v1 → v7)</text>
<text x="74" y="182" font-size="14" fill="#9fb39d" font-weight="normal" text-anchor="start" >• 03 모델 비교 (Dummy, Z-score, IF, RF)</text>
<text x="74" y="208" font-size="14" fill="#9fb39d" font-weight="normal" text-anchor="start" >• 05 관제용 모델 저장 (registry)</text>
<rect x="430" y="60" width="340" height="190" rx="16" fill="#131b15" stroke="#ffb347" stroke-opacity="0.7"/>
<rect x="430" y="60" width="6" height="190" rx="3" fill="#ffb347"/>
<text x="454" y="96" font-size="22" fill="#e9f2e8" font-weight="bold" text-anchor="start" >cal01-review</text>
<text x="454" y="120" font-size="14" fill="#ffb347" font-weight="normal" text-anchor="start" >공동 검토 사이트</text>
<text x="454" y="156" font-size="14" fill="#9fb39d" font-weight="normal" text-anchor="start" >• 3σ 후보와 모델 후보를 그래프로 봄</text>
<text x="454" y="182" font-size="14" fill="#9fb39d" font-weight="normal" text-anchor="start" >• 팀이 1, 0, 보류를 남김 (T, S, M)</text>
<text x="454" y="208" font-size="14" fill="#9fb39d" font-weight="normal" text-anchor="start" >• 검토 표 CSV로 내보냄</text>
<rect x="810" y="60" width="340" height="190" rx="16" fill="#131b15" stroke="#5ec8ff" stroke-opacity="0.7"/>
<rect x="810" y="60" width="6" height="190" rx="3" fill="#5ec8ff"/>
<text x="834" y="96" font-size="22" fill="#e9f2e8" font-weight="bold" text-anchor="start" >cal01-monitor</text>
<text x="834" y="120" font-size="14" fill="#5ec8ff" font-weight="normal" text-anchor="start" >소둔로 관제</text>
<text x="834" y="156" font-size="14" fill="#9fb39d" font-weight="normal" text-anchor="start" >• 3D 소둔로와 채널 위치</text>
<text x="834" y="182" font-size="14" fill="#9fb39d" font-weight="normal" text-anchor="start" >• Z-score 경보와 현장 요청</text>
<text x="834" y="208" font-size="14" fill="#9fb39d" font-weight="normal" text-anchor="start" >• 구역별 모델을 레지스트리에서 읽음</text>
<line x1="390" y1="155" x2="430" y2="155" stroke="#9fb39d" stroke-width="3" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.2s" repeatCount="indefinite"/></line>
<polygon points="424,148 434,155 424,162" fill="#9fb39d"/>
<line x1="770" y1="155" x2="810" y2="155" stroke="#9fb39d" stroke-width="3" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.2s" repeatCount="indefinite"/></line>
<polygon points="804,148 814,155 804,162" fill="#9fb39d"/>
<path d="M 600 250 C 600 276, 220 276, 220 252" fill="none" stroke="#ffb347" stroke-width="2" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/></path>
<text x="410" y="300" font-size="13" fill="#ffb347" font-weight="normal" text-anchor="middle" >팀 판단이 검토 표로 돌아와 다음 정답(v6, v7)이 됨</text>
<text x="600.0" y="36" font-size="16" fill="#9fb39d" font-weight="normal" text-anchor="middle" >세 저장소가 한 흐름으로 이어집니다</text>
</svg>
